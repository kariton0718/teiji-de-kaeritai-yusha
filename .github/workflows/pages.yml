name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Sleep Early Hero
        run: node --test games/hayaku-netai-yusha/tests/*.test.js
      - name: Prepare static game
        run: |
          mkdir _site
          cp index.html styles.css title-art.css bestiary.css coop.html coop.css _site/
          cp -r src assets _site/
          mkdir -p _site/hayaku-netai-yusha
          cp games/hayaku-netai-yusha/index.html games/hayaku-netai-yusha/*.css games/hayaku-netai-yusha/*.js _site/hayaku-netai-yusha/
          mkdir -p _site/hayaku-netai-yusha/assets/characters
          cp games/hayaku-netai-yusha/assets/characters/*.webp _site/hayaku-netai-yusha/assets/characters/
          mkdir -p _site/hayaku-netai-yusha/assets/title
          cp games/hayaku-netai-yusha/assets/title/*.webp _site/hayaku-netai-yusha/assets/title/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
