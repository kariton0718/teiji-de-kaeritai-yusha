<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24364f"><meta name="description" content="定時で帰った勇者の、もうひとつの冒険。ママと愛犬ポチと一緒に、家事を片づけ、子どもを寝かしつけよう。">
  <title>早く寝たい勇者｜定時で帰りたい勇者シリーズ</title>
  <link rel="stylesheet" href="./styles.css?v=0.4.1">
  <link rel="stylesheet" href="./title-screen.css?v=0.4.1">
  <link rel="stylesheet" href="./adventure.css?v=0.4.1">
</head>
<body>
<main class="shell">
  <section class="game" aria-label="早く寝たい勇者">
    <header class="hud" id="hud" hidden>
      <div class="topline"><span id="chapter">夜の冒険</span><span id="clock">18:30</span><button id="sound" class="small" aria-label="音を切り替える" aria-pressed="false">音 OFF</button></div>
      <div class="energy-row"><span>気力</span><div class="bar"><i id="energy-fill"></i></div><strong id="energy">100</strong></div>
      <div class="objective-row"><span id="objective">お片づけ</span><span id="counter">0 / 105</span></div>
      <div class="bar progress"><i id="progress-fill"></i></div>
      <div id="ally-status" class="ally-status">ママ：追従・回復と援護 ／ ポチ：アイテム回収</div>
      <div id="buff-status" class="buff-status" role="status"></div>
    </header>
    <div class="arena" id="arena"><canvas id="canvas" width="480" height="620" aria-label="ゲーム画面。画面をスライドして移動、通常攻撃は自動です。"></canvas>
      <div id="notice" class="notice" role="status"></div>
      <button id="ultimate" class="ultimate" hidden><span id="ult-name">本日は閉店です！</span><small id="ult-value">35%</small></button>
    </div>
    <footer id="controls" class="controls" hidden><span>画面をスライドして移動・攻撃は自動</span><span id="skill-list">🧹 1</span></footer>
    <section id="overlay" class="overlay" aria-label="メニュー"></section>
  </section>
  <aside class="desktop-note"><span class="series-tag">定時で帰りたい勇者 SERIES / 02</span><h2>今日も、おつかれさま。</h2><p>家事をまとめて片づけて、<br>家族みんなで、おやすみなさい。</p><p class="keys">PC：WASD / 矢印で移動<br>Space：必殺技</p><a href="https://kariton0718.github.io/teiji-de-kaeritai-yusha/" target="_blank" rel="noopener">第1作「定時で帰りたい勇者」 ↗</a></aside>
</main>
<noscript>このゲームを遊ぶには、ブラウザーのJavaScriptを有効にしてください。</noscript>
<script type="module" src="./main.js?v=0.4.1"></script>
</body>
</html>
