<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Battle Story Edition ブラウザー検証</title>
<style>body{background:#142934;color:#eee;font:14px sans-serif;margin:16px}.panel{max-width:560px}iframe{width:390px;height:844px;border:1px solid #aaa;float:right}li{margin:9px}button{padding:11px;margin:4px}@media(max-width:850px){iframe{float:none;max-width:100%}}</style>
<div class="panel"><h1>Auto Battle Story Edition ブラウザー検証</h1><p>390×844の実ゲームを操作します。全画面スティック、自動攻撃、必殺同時入力、物語、6ステージ通し進行を確認します。</p><button id="checks">結合確認</button><button id="play">加速通しプレイ</button><button id="visual">後半表示</button><ol id="results"></ol></div>
<iframe src="/" title="テスト対象ゲーム"></iframe>
<script type="module">
const frame=document.querySelector('iframe');function run(mode){document.querySelectorAll('button').forEach(b=>b.disabled=true);const s=document.createElement('script');s.type='module';s.src='/tests/browser-check.js?mode='+mode;frame.contentDocument.body.append(s);}document.querySelector('#checks').onclick=()=>run('checks');document.querySelector('#play').onclick=()=>run('play');document.querySelector('#visual').onclick=()=>run('visual');
</script></html>
