<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0.3 ブラウザー結合テスト</title>
<style>body{background:#182b35;color:#eee;font:14px sans-serif;margin:16px}iframe{width:390px;height:844px;border:1px solid #aaa;float:right}li{margin:10px}button{padding:12px;margin:5px}pre{white-space:pre-wrap}.panel{max-width:550px} @media(max-width:850px){iframe{float:none;max-width:100%}}</style>
<div class="panel"><h1>0.3 ブラウザー結合テスト</h1><p>下の実ゲームを操作するローカル確認ページです。結合テストは状態設定を含みます。通しプレイは位置・進捗・時計を変更せず、合成キー入力で3ステージを順に遊びます。</p><button id="run">結合テストを実行</button><button id="play">通しプレイを実行</button><ol id="results"></ol></div>
<iframe src="/?test=1" title="テスト対象ゲーム"></iframe>
<script type="module">
const frame=document.querySelector('iframe');
function run(mode){
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  const script=document.createElement('script');script.type='module';script.src='/tests/browser-check.js?mode='+mode;
  frame.contentDocument.body.append(script);
}
document.querySelector('#run').onclick=()=>run('checks');
document.querySelector('#play').onclick=()=>run('play');
</script></html>
